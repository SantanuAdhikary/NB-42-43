<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>semantic tag code </title>

    <style>
        nav{
          height: 80px;  
          background-color: #333;
          color:white;
          padding: 30px;
        }

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        header{
            height: 200px;
            background-color: lightgreen;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap:15px;
        }

        main{
            height: 300px;
            background-color: bisque;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap:15px;
        }

        figure{
            height: 200px;
            width: 300px;
            background-color: white;
            padding: 15px;
            text-align: center;
        }

        img{
            height: 80%;
        }

        section{
            height: 250px;
            display: flex;
            background-color: lightslategray;
            padding: 20px;
            gap:10px;
        }

        aside{
            flex-basis: 50%;
            background-color: chocolate;
        }

        article{
            flex-basis: 50%;
            background-color: blueviolet;
        }

        footer{
            height: 150px;
            background-color: lightseagreen;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    
    <nav>
        <h2>semanticLogo</h2>
    </nav>

    <header>
        <h1>welcome to section tags in html</h1>
        <p>semantic tags having some meanings.</p>
        <a href="">get more info</a>
    </header>

    <main>

        <h2>how to add image</h2>

        <figure>
            <img src="https://images.pexels.com/photos/694636/pexels-photo-694636.jpeg" alt="">

            <figcaption>mountain image</figcaption>
        </figure>
         
    </main>


    <section>
         <aside>
             <h2>i am aside tag</h2>
         </aside>

         <article>
             <h2> i am article tag</h2>
         </article>
    </section>

    <footer>

        <details>
            <summary>click here to know something</summary>
            <h2>NB42 and NB43</h2>
            <p> this is multi-talented Batch </p>
        </details>

    </footer>
</body>
</html>
