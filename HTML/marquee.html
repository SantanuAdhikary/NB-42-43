<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>marquee tag</title>

        <style>
             .m{
                border: 5px solid red;
             }
        </style>
    </head>
    <body>
        
        
    <marquee behavior="" direction="">
            
            <h1>Breaking News : upcoming Sunday will be holiday 🕺🏻💃🏻</h1>
    </marquee>

    <marquee behavior="alternate" loop="4" direction="right" scrollamount="30">

        <h2>Another Breaking News : If you are getting placed you should give me gift</h2>

    </marquee>


    <marquee behavior="" direction="right" width="900">
        <img src="https://media.tenor.com/5fq2ANoCeWsAAAAM/bird-flying.gif" alt="">
        <img src="https://gifdb.com/images/thumbnail/superman-flying-freestyle-strokes-khbeu1nbhoptks3g.gif" alt="">
    </marquee>

    <marquee behavior="" direction="" scrollamount="30">

        <img src="https://images.hive.blog/0x0/https://files.peakd.com/file/peakd-hive/shrazi/23wqbtp7V357RAAPHjqRLweRFCpDRsFF4Mi1KA3Au11Fmw8qfLYfNTuh9uUCtyQhw69nj.gif" alt="" height="200">

        <img src="https://i.pinimg.com/originals/f7/78/ca/f778cab57fd6bf669fe7b12d971a843c.gif" alt="" height="200">
    </marquee>


    <marquee behavior="" direction="up" scrollamount="50" width="800" class="m" height="500">
        <h1>this is one example</h1>
    </marquee>

</body>
</html>
