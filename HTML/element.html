<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>element</title>

    <style>
         h1{
            background-color: red;
            height: 100px;
            width: 400px;
         }

         section{
            height: 300px;
            width: 400px;
            border: 3px solid black;
         }

         b{
            background-color: blue;
              height: 100px;
            width: 400px;
         }
         i{
            background-color: green;
              height: 100px;
            width: 400px;
         }
         u{
            background-color: pink;
              height: 100px;
            width: 400px;
         }

         button{
            width: 300px;
            height: 100px;
         }
    </style>
</head>
<body>
    <h1>element in html</h1>


    <b>hello hi bye</b>
    <i>how are you</i>

    <h1>i am h1</h1>
    <p> i am paragraph</p>
    <h2> I am h2</h2>


    <section>
         <h1>i am section tag</h1>
    </section>

    <button>submit</button>
    <button>reset</button>
    <input type="text">

</body>
</html>
