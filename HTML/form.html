<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student form</title>
</head>
<body>

    <h1>Student Form</h1>

    <form action="">

        <fieldset>

            <legend>student form</legend>

            <label for="sname">student name</label>
            <input 
                type="text"
                placeholder="enter your name" 
                id="sname"
                name="sname"
                required
                
                >  <br>
    
            <label for="phone">phone number</label>
            <input 
               type="text"
               placeholder="enter your phone number"
               id="phone"
               name="phNo"
               maxlength="10"
               > <br>
    
            <label for="pass">password</label>
            <input 
               type="password" 
               id="pass" 
               placeholder="enter your password"
               name="pass"
               minlength="5"
               > <br>

               <label for="age">age</label>
               <input type="number" name="age" id="age" placeholder="enter your age"> <br>

               <label for="email">email</label>
               <input type="email" name="email" id="email" placeholder="enter your email" value="stu@gmail.com" readonly> <br>


               <label for="">subjects</label>  <br>

               <label for="sub1">HTML</label>
               <input type="checkbox" name="sub1" id="sub1" value="html">

               <label for="sub2">CSS</label>
               <input type="checkbox" name="sub2" id="sub2" value="css">

               <label for="sub3">JavaScript</label>
               <input type="checkbox" name="sub3" id="sub3" value="js"> <br>

               <label for="">Gender</label> <br>

               <label for="male">Male</label>
               <input type="radio" name="gender" id="male" value="male">

               <label for="female">Female</label>
               <input type="radio" name="gender" id="female" value="female">

               <label for="others">Others</label>
               <input type="radio" name="gender" id="others" value="others">  <br>

               <label for="address">Address</label> <br>
               <textarea name="address" id="address" placeholder="enter your address" rows="10" cols="40"></textarea> <br>

               <label for="">select course</label>

               <select name="course" id="">
                  <option value=""></option>
                  <option value="java">java</option>
                  <option value="python">python</option>
                  <option value="typescript">typescript</option>
               </select>
               <br>

               <label for="">Date of Birth</label>
               <input type="date" name="dob" id=""> <br>

               <label for="">expected Salary</label>
               <input type="range" name="sal" id="" min="1" max="50000000c"> <br>


               <button type="submit">register</button>
               <button type="reset">reset</button>


        
              
        </fieldset>

    </form>    
    
</body>    
</html>
