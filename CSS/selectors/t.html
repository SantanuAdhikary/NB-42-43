<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Menu</title>

    <style>
        /* Element Selector */
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* ID Selector */
        #menu-title {
            text-align: center;
            color: darkred;
        }

        /* Element Selector */
        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
        }

        /* Element Selector */
        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        /* Element Selector */
        th {
            background-color: darkred;
            color: white;
        }

        /* Class Selector */
       .veg {
            background-color: #d9f2d9;
        }

        /* Class Selector */
        .nonveg {
            background-color: #ffd6d6;
        }

        /* Class Selector */
        .special {
            background-color: #ffe680;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1 id="menu-title">ABC Restaurant Menu</h1>

    <table>

        <!-- Main Heading -->
        <tr>
            <th colspan="4">Today's Menu</th>
        </tr>

        <!-- Column Headings -->
        <tr>
            <th>Category</th>
            <th>Dish</th>
            <th>Type</th>
            <th>Price</th>
        </tr>

        <!-- Starters -->
        <tr>
            <td rowspan="3">Starters</td>
            <td>Veg Spring Roll</td>
            <td class="veg">Veg</td>
            <td>₹120</td>
        </tr>

        <tr>
            <td>Paneer Tikka</td>
            <td class="veg">Veg</td>
            <td>₹180</td>
        </tr>

        <tr>
            <td>Chicken Wings</td>
            <td class="nonveg">Non-Veg</td>
            <td>₹220</td>
        </tr>

        <!-- Main Course -->
        <tr>
            <td rowspan="3">Main Course</td>
            <td>Veg Biryani</td>
            <td class="veg">Veg</td>
            <td>₹200</td>
        </tr>

        <tr>
            <td>Paneer Butter Masala</td>
            <td class="veg">Veg</td>
            <td>₹220</td>
        </tr>

        <tr>
            <td>Chicken Biryani</td>
            <td class="nonveg">Non-Veg</td>
            <td>₹280</td>
        </tr>

        <!-- Special -->
        <tr>
            <td colspan="3" class="special">Chef's Special</td>
            <td class="special">₹350</td>
        </tr>

    </table>

</body>
</html>
