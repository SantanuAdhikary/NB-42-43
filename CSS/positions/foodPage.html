<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>foodPage</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .outer{
            height: 100vh;
            background: linear-gradient(blue,white);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .outer > .inner{
            height: 500px;
            width: 500px;
            border-radius: 15px;
            background:linear-gradient(red,yellow);
            position: relative;
        }

        .inner > img{
            position: absolute;
        }

        #burger{
            bottom: 10px;
        }

        #drinks{
            bottom:10px;
            z-index: 8;
        }

        #discount{
            height: 180px;
            bottom: 10px;
            left: 100px;
            z-index: 10;
            animation: spin 2s ease-in infinite;
        }

        @keyframes spin {
            from{
               transform: rotate(0deg);
            }
            to{      
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    
    <div class="outer">
         <div class="inner">

            <img src="./drinks.png" alt="" id="drinks">
            <img src="./discount.png" alt="" id="discount">
            <img src="./burger.png" alt="" id="burger">
             
         </div>
    </div>
</body>
</html>
