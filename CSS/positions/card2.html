<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card 2 </title>

    <style>
         *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
         }

         .outer{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
         }

         .inner{
            height: 500px;
            width: 500px;
            border: 5px solid black;
            position: relative;
            border-radius: 50%;
         }

         .circle{
            height: 200px;
            width: 200px;
            border: 5px solid black;
            border-radius: 50%;
         }

         #c1{
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top:-100px;
            background-color: red;
         }

         #c2{
            position: absolute;
            background-color: green;
            top:50%;
            transform: translateY(-50%);
            left:-100px;
        }
        #c3{
            position: absolute;
            background-color: lightpink;
            right: 0;
            top:50%;
            transform: translateY(-50%);
            right: -100px;
         }
        #c4{
            position: absolute;
            background-color: darkmagenta;
          
            left: 50%;
            transform: translateX(-50%);
            bottom: -100px;
           
         }
        #c5{
            position: absolute;
            background-color: black;
          
            left: 50%;
            top:50%;
            transform: translate(-50%,-50%);
           
         }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">
             
            <div class="circle" id="c1"></div>
            <div class="circle" id="c2"></div>
            <div class="circle" id="c3"></div>
            <div class="circle" id="c4"></div>
            <div class="circle" id="c5"></div>
        </div>
    </div>
</body>
</html>
