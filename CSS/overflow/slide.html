    <title>slide</title>

    <style>
         *{
            padding: 0;
            margin: 0;;
            box-sizing: border-box;
         }
         .outer{
            height: 100vh;
            background:linear-gradient(to top right,red,black);
            display: flex;
            align-items: center;
            gap:10px;

            overflow:auto;
         }

         img{
            height: 250px;
            border-radius: 10px;
            box-shadow: 2px 4px 4px black;
            transition: all 0.6s ease-in;
            cursor: pointer;
         }

         img:hover{
            transform: scale(1.04);
         }

         ::-webkit-scrollbar{
            display: none;
         }
    </style>
</head>
